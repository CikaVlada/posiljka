<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#070d14">
<title>OPERACIJA X — Presretnuta pošiljka</title>
<style>
:root{--bg:#070d14;--panel:#101d29;--line:#294658;--green:#79f5b4;--red:#ff6673;--text:#e5f2f8;--muted:#a4b9c7}*{box-sizing:border-box}body{background:radial-gradient(circle at 50% -10%,#153448,#070d14 60%);color:var(--text);font-family:Consolas,'Courier New',monospace;min-height:100svh;margin:0;padding:clamp(15px,3vw,34px);display:grid;place-items:center}body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 3px 4px);pointer-events:none;opacity:.36}.app{max-width:740px;width:100%;position:relative;z-index:1}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--green);font-size:.77rem;letter-spacing:.1em;margin-bottom:16px}.pulse{width:8px;height:8px;background:var(--red);border-radius:100%;display:inline-block;margin-right:6px;box-shadow:0 0 10px var(--red);animation:blink 1.5s infinite}@keyframes blink{50%{opacity:.3}}.panel{background:#0c1825ed;border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 50px #0008;padding:clamp(20px,5vw,36px)}.tag{color:var(--red);font-size:.79rem;letter-spacing:.14em;font-weight:700}h1{font-size:clamp(1.5rem,5vw,2.7rem);line-height:1.16;margin:13px 0 18px;color:var(--red);text-shadow:0 0 22px #d23b4b36}h2{font-size:clamp(1.25rem,4vw,1.8rem);line-height:1.35;margin:10px 0 18px}p{line-height:1.65;color:var(--muted);font-size:clamp(.94rem,2.5vw,1.05rem)}strong{color:white}.btn{background:var(--green);color:#07150f;border:0;border-radius:10px;padding:15px 20px;min-height:48px;font-weight:900;letter-spacing:.055em;font:inherit;cursor:pointer;width:100%;margin-top:14px}.btn:active{transform:translateY(1px)}.btn.secondary{background:#192e3c;border:1px solid #46616a;color:var(--text)}.btn:disabled{opacity:.5;cursor:default}.timer{font-variant-numeric:tabular-nums;border:1px solid #385163;background:#102636;border-radius:10px;padding:9px 13px;color:var(--green);font-size:1.15rem;font-weight:bold;white-space:nowrap}.timer.expired{color:#ffca79}.progress{display:flex;gap:8px;margin-bottom:24px}.pip{flex:1;height:7px;border-radius:12px;background:#263745}.pip.done{background:var(--green);box-shadow:0 0 9px #3eea9870}.question{border:1px solid var(--line);background:#122535;padding:15px;border-radius:10px;margin:18px 0;font-size:1.12rem;line-height:1.5}.choices{display:grid;gap:10px}.choice{border:1px solid #385365;border-radius:10px;background:#162635;color:var(--text);padding:13px;text-align:left;font:inherit;cursor:pointer;min-height:48px}.choice.selected{border-color:var(--green);background:#173c3c}.choice:focus-visible,.btn:focus-visible{outline:3px solid #a4ffe0;outline-offset:2px}.notice{margin-top:12px;color:var(--red);font-size:.9rem;min-height:23px}.success{color:var(--green)}.mapWrap{border:1px solid #33586a;border-radius:12px;overflow:hidden;position:relative;background:#102434;margin:19px 0}.mapWrap svg{display:block;width:100%;height:auto}.cover{position:absolute;top:0;bottom:0;width:33.3334%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#101a26 0 12px,#152333 12px 24px);border-right:2px solid #496477;color:#c8dae4;font-size:.74rem;letter-spacing:.04em;text-align:center;transition:opacity .7s ease,visibility .7s ease}.cover:nth-of-type(1){left:0}.cover:nth-of-type(2){left:33.333%}.cover:nth-of-type(3){left:66.666%;border-right:0}.cover.unlocked{opacity:0;visibility:hidden}.hint{font-size:.82rem;color:#88b6c6;margin:10px 0}.address{background:#153b32;border:1px solid #3a9070;border-radius:12px;padding:18px;line-height:1.5;margin:20px 0}.address b{color:var(--green)}.tiny{font-size:.78rem;color:#8aa3b3}.hidden{display:none!important}.intro-code{background:#132331;border:1px dashed #426173;border-radius:10px;padding:14px;margin:20px 0;color:#a7ecce;letter-spacing:.05em}.bigqr{background:white;padding:17px;width:min(78vw,330px);height:min(78vw,330px);display:grid;place-items:center;margin:25px auto;border-radius:8px}.bigqr img{width:100%;height:100%;object-fit:contain}.tv{max-width:1100px}.tv .panel{text-align:center;padding:clamp(24px,5vw,65px)}.tv h1{font-size:clamp(2rem,6vw,4.6rem)}.tv p{font-size:clamp(1rem,2vw,1.5rem)}.tv .top{font-size:1rem}#qrMissing{color:#111;letter-spacing:0;font-family:system-ui;font-size:1rem;line-height:1.4}.glitch{animation:glitch 5s infinite}@keyframes glitch{0%,96%,100%{text-shadow:0 0 18px #ff556650}97%{text-shadow:4px 0 #36f6e9,-4px 0 #ff5572}98%{text-shadow:-3px 0 #36f6e9,3px 0 #ff5572}}a{color:#09150e;text-decoration:none;display:block;text-align:center}.footer{font-size:.72rem;color:#66899a;text-align:center;margin-top:16px}@media(max-width:480px){.panel{padding:18px}.top{font-size:.66rem}.question{font-size:1rem}}
</style></head>
<body><main id="app" class="app" aria-live="polite"></main>
<script>
(() => {
 const LOCATION='Blagoja Parovića 1B, Niš';
 const MAP_URL='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Blagoja Parovića 1B, Niš, Srbija');
 const GAME_URL=location.origin+location.pathname+'?play=1';
 const QUESTIONS=[
  {universe:'HARRY POTTER',headline:'Dosije čarobnjaka',question:'Ko je Hariju Poteru dao Mapu haradžija (Marauder’s Map), koja prikazuje tajne prolaze i ljude u Hogvortsu?',choices:['Hagrid','Fred i Džordž Vizli','Hermiona Grejndžer','Albus Dambldor'],correct:1,clue:'Fragment 1/3 vraćen. Hakovana mapa počinje da se pojavljuje.'},
  {universe:'ROBLOX',headline:'Digitalni upad',question:'Kako se zove zvanični program u kome kreatori prave i uređuju svoje Roblox igre (experiences)?',choices:['Roblox Builder','Roblox Studio','Roblox Creator Mode','Robux Workshop'],correct:1,clue:'Fragment 2/3 vraćen. Još samo jedan deo lokacije.'},
  {universe:'MINECRAFT',headline:'Portal za izlaz',question:'Napravio si okvir Nether portala od opsidijana. Šta ti je potrebno da ga aktiviraš?',choices:['Kanta vode','Ender Pearl','Kremen i čelik (Flint and Steel)','Redstone baklja'],correct:2,clue:'Fragment 3/3 vraćen. Lokacija je dešifrovana!'}
 ];
 let step=0,selected=null,start=null,tick=null,expired=false;
 const app=document.getElementById('app');
 const pad=n=>String(n).padStart(2,'0');
 function timerText(){ if(!start)return '15:00'; let secs=Math.max(0,900-Math.floor((Date.now()-start)/1000));return pad(Math.floor(secs/60))+':'+pad(secs%60); }
 function header(){return `<div class="top"><span><i class="pulse"></i> SIGNAL PRESRETNUT // OPERACIJA X</span><span class="timer" id="timer">${timerText()}</span></div>`}
 function mapHTML(){return `<div class="mapWrap" role="img" aria-label="Tri zaključana fragmenta šematske mape lokacije"><svg viewBox="0 0 660 245" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="660" height="245" fill="#142b3a"/><g stroke="#294658" stroke-width="1">${Array.from({length:14},(_,i)=>`<path d="M${i*50} 0V245"/>`).join('')}${Array.from({length:6},(_,i)=>`<path d="M0 ${i*50}H660"/>`).join('')}</g><g fill="none" stroke="#688da2" stroke-width="18" stroke-linejoin="round"><path d="M-10 180H190L310 55H510L670 155"/><path d="M310 0V245"/></g><g fill="none" stroke="#b2d4dd" stroke-width="2" stroke-dasharray="7 9"><path d="M-10 180H190L310 55H510L670 155"/><path d="M310 0V245"/></g><circle cx="85" cy="180" r="13" fill="#64e4c3" stroke="white" stroke-width="3"/><g transform="translate(526 75)"><path d="M0 -20C-24 -20 -24 12 0 31C24 12 24 -20 0 -20Z" fill="#ff6673"/><circle cx="0" cy="-7" r="7" fill="white"/></g><text x="12" y="232" font-family="monospace" font-size="14" fill="#9ebcca">ŠEMATSKA MAPA / NIJE ZA NAVIGACIJU</text></svg>${[0,1,2].map(i=>`<div class="cover ${step>i?'unlocked':''}" style="left:${i*33.333}%">🔒<br>FRAGMENT ${i+1}</div>`).join('')}</div>`}
 function updateTimer(){const e=document.getElementById('timer');if(e){e.textContent=timerText();if(start&&timerText()==='00:00'){e.classList.add('expired');if(!expired){expired=true;const n=document.getElementById('notice');if(n)n.textContent='SISTEMSKA GREŠKA: odbrojavanje zaustavljeno. Misija se nastavlja!'}}}}
 function boot(){ if(new URLSearchParams(location.search).has('tv'))return renderTV();renderIntro();}
 function renderTV(){app.className='app tv'; app.innerHTML=`<div class="top"><span><i class="pulse"></i> NEOVLAŠĆENA TRANSMISIJA</span><span>PRIORITET: KRITIČAN</span></div><section class="panel"><div class="tag">[ UPOZORENJE: SISTEM KOMPROMITOVAN ]</div><h1 class="glitch">VAŠA POŠILJKA JE OTETA</h1><p>Imamo nešto što pripada tebi. Ako želiš da otkriješ gde je, dokaži da možeš da probiješ naše tri zaštite.</p><p><strong>15 MINUTA. TRI PITANJA. JEDNA LOKACIJA.</strong></p><div class="bigqr" id="qr"><span id="qrMissing">Podesi javnu adresu sajta da se pojavi QR kod.</span></div><div class="tag">SKENIRAJ KOD. POVRATI LOKACIJU.</div><p class="tiny">Simulacija tajne misije • tajmer počinje nakon pokretanja igre</p></section><div class="footer">OPERACIJA X // TV TRANSMISIJA</div>`;
 }
 function renderIntro(){app.className='app';app.innerHTML=header()+`<section class="panel"><div class="tag">[ DOSIJE #X-001 // STROGO POVERLJIVO ]</div><h1 class="glitch">POŠILJKA JE PRESRETNUTA</h1><p>Mi smo grupa koja je preuzela lokaciju tvoje tajne pošiljke. Odlučili smo da ti damo jednu šansu da je povratiš.</p><div class="intro-code">3 sigurnosna nivoa / 3 dela mape / 15:00 na satu</div><p>Svaki tačan odgovor otključava jedan deo skrivene mape. Kad sastaviš sva tri dela, saznaćeš gde te čeka paket.</p><p class="tiny">Tajmer je samo deo igre. Nema kazne ako istekne.</p><button class="btn" id="begin">▶ PRIHVATAM IZAZOV</button></section><div class="footer">OPERACIJA X // SISTEM ZA POVRAĆAJ LOKACIJE</div>`;document.getElementById('begin').onclick=()=>{start=Date.now();expired=false;step=0;renderGame();clearInterval(tick);tick=setInterval(updateTimer,1000)};}
 function renderGame(feedback=''){const q=QUESTIONS[step];if(!q)return renderFinal();selected=null;app.innerHTML=header()+`<section class="panel"><div class="tag">[ NIVO ${step+1}/3 // ${q.universe} ]</div><h2>${q.headline}</h2><div class="progress">${[0,1,2].map(i=>`<span class="pip ${i<step?'done':''}"></span>`).join('')}</div><div class="question">${q.question}</div><div class="choices">${q.choices.map((c,i)=>`<button type="button" class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${c}</button>`).join('')}</div><div id="notice" class="notice" role="status">${feedback}</div><button class="btn" id="check">PROBIJ ZAŠTITU</button>${mapHTML()}<p class="hint">Svaki tačan odgovor otkriva po jedan fragment lokacije.</p></section>`;
 document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.choice);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===el));document.getElementById('notice').textContent='';});document.getElementById('check').onclick=()=>{const n=document.getElementById('notice');if(selected===null){n.textContent='Najpre izaberi odgovor.';return}if(selected!==q.correct){n.textContent='PRISTUP ODBIJEN. Pokušaj ponovo — nema kazne.';return}step++;if(step===3){renderFinal();return}renderUnlocked(q.clue)};updateTimer();}
 function renderUnlocked(clue){app.innerHTML=header()+`<section class="panel"><div class="tag success">[ ZAŠTITA PROBIJENA ]</div><h2 style="color:var(--green)">FRAGMENT ${step}/3 OTKLJUČAN</h2><p>${clue}</p>${mapHTML()}<button class="btn" id="next">NASTAVI NA SLEDEĆI NIVO →</button></section>`;document.getElementById('next').onclick=()=>renderGame();updateTimer();}
 function renderFinal(){clearInterval(tick);app.innerHTML=header()+`<section class="panel"><div class="tag success">[ PRISTUP ODOBREN // SVI FRAGMENTI OTKLJUČANI ]</div><h1 style="color:var(--green)">LOKACIJA POVRAĆENA!</h1><p>Uspeo si. Tri zaštite su pale. Lokacija tajne pošiljke sada pripada tebi.</p>${mapHTML()}<div class="address"><div class="tiny">CILJ MISIJE // PREUZIMANJE PAKETA</div><b>${LOCATION}</b><br>Poštin paketomat br. <b>18602</b></div><p>Uzmi torbu i povedi svog operativca. Čeka vas izlazak na teren! 🛴</p><a class="btn" href="${MAP_URL}" target="_blank" rel="noopener noreferrer">📍 OTVORI PRAVU MAPU / NAVIGACIJU</a><p class="tiny">Misija ostaje uspešno završena čak i ako je odbrojavanje isteklo. Odlazak do paketomata može biti kasnije.</p></section>`;updateTimer();}
 boot();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>if(new URLSearchParams(location.search).has('tv')){const u=location.origin+location.pathname+'?play=1';const container=document.getElementById('qr');if(container && typeof QRCode!=='undefined'){container.innerHTML='';new QRCode(container,{text:u,width:270,height:270,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else if(container){container.innerHTML='<span id="qrMissing">QR nije učitan. Proveri internet vezu.</span>'}}</script>
</body></html>
